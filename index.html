<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Altus</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/demos.css">
</head>
<body>

  <div class="masthead">
    <div class="kicker">Altus</div>
    <h1>Catálogo de Servicios — edición 2026</h1>
  </div>

  <div class="stage-wrap">
    <div class="book-frame">
      <div id="book"></div>
    </div>
  </div>

  <div class="stage-controls">
    <button id="btnPrev" type="button">◂ Anterior</button>
    <span id="pageCounter">01 / 06</span>
    <button id="btnNext" type="button">Siguiente ▸</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/demos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
